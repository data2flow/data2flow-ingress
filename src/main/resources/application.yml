# 공통 설정(design/conventions.md §4). 환경별 값은 application-{local,staging,prod}.yml, 비밀값은 환경변수.
# 키 설명과 .env 키 이름은 README "설정"에 있다.
spring:
  application:
    name: data2flow-ingress
  profiles:
    default: local
  threads:
    virtual:
      enabled: true
  lifecycle:
    # 종료 단계마다 최대 30초: 소스 drain(최대 20초) → 스트림 생산자 닫기(reliability-and-ha.md §4.1)
    timeout-per-shutdown-phase: 30s
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false
  # RabbitMQ AMQP(s4, vhost: prod data2flow · staging data2flow-stg · local data2flow-dev, ADR-020·030):
  # data2flow.config 설정 변경 수신, data2flow.events 상태 보고
  rabbitmq:
    host: ${DATA2FLOW_RABBITMQ_HOST:localhost}
    port: ${DATA2FLOW_RABBITMQ_PORT:5672}
    virtual-host: ${DATA2FLOW_RABBITMQ_VHOST:data2flow-dev}
    username: ${DATA2FLOW_RABBITMQ_USERNAME:guest}
    password: ${DATA2FLOW_RABBITMQ_PASSWORD:guest}
    connection-timeout: 5s
server:
  port: 8080
  shutdown: graceful

# actuator는 8081(프로브·지표 전용, k8s Service로 노출하지 않음)
management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      # 관리 포트(8081)는 클러스터 안에서만 닿는다. 소스별 연결 상태를 자세히 보여 준다
      show-details: always
      show-components: always
      group:
        # readiness: data2flow.raw에 기록할 수 있어야 한다(reliability-and-ha.md §4.2). AMQP(설정·상태 이벤트)는 잠시 없어도 수집은 계속
        readiness:
          include: readinessState,rawStream
  health:
    rabbit:
      enabled: false
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${DATA2FLOW_TRACING_SAMPLING:0.1}
  # OTLP 내보내기는 주소를 정한 환경에서만(OPS-02.03). 지표는 Prometheus로 본다
  otlp:
    metrics:
      export:
        enabled: false

data2flow:
  ingress:
    # 파드 이름(StatefulSet data2flow-ingress-0·-1). 끝 번호가 client-id 번호(BR-DSC-01)
    instance-id: ${HOSTNAME:ingress-local-0}
    env: ${DATA2FLOW_INGRESS_ENV:dev}
    developer: ${DATA2FLOW_DEV_NAME:}
    core-uri: ${DATA2FLOW_CORE_URI:http://data2flow-core-api}
    source-filter:
      organization-ids: ${DATA2FLOW_INGRESS_ORGANIZATION_IDS:}
      denied-hosts: ${DATA2FLOW_INGRESS_DENIED_HOSTS:}
    # auth.credentialRef가 가리키는 비밀값(core가 비밀값을 주지 않을 때만). iot-data는 사용자:비밀번호(.env MQTT_BASIC_AUTH)
    credentials:
      iot-data-basic: ${MQTT_BASIC_AUTH:}
    stream:
      host: ${DATA2FLOW_RABBITMQ_HOST:localhost}
      port: ${DATA2FLOW_RABBITMQ_STREAM_PORT:5552}
      virtual-host: ${DATA2FLOW_RABBITMQ_VHOST:data2flow-dev}
      username: ${DATA2FLOW_RABBITMQ_USERNAME:guest}
      password: ${DATA2FLOW_RABBITMQ_PASSWORD:guest}
    # 플랫폼 브로커(DSC-03.01, ADR-029): PLATFORM_BROKER 소스 설정에는 주소가 없어 이 값을 쓴다. 공용 브로커는 구독만 한다
    platform-broker:
      url: ${DATA2FLOW_PLATFORM_BROKER_URL:wss://iot-data.java21.net/mqtt}
      topics: ${DATA2FLOW_PLATFORM_BROKER_TOPICS:devices/+/telemetry}
      version: ${DATA2FLOW_PLATFORM_BROKER_MQTT_VERSION:5.0}
      username: ${DATA2FLOW_PLATFORM_BROKER_USERNAME:}
      password: ${DATA2FLOW_PLATFORM_BROKER_PASSWORD:}
    # 기기 서명 키 캐시(DSC-03.02: 폐기 1분 안 반영, 60초 이하만 허용)
    signing:
      refresh-interval: ${DATA2FLOW_SIGNING_KEY_REFRESH:30s}
